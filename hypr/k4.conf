# Generated by the k4 installer. DO NOT EDIT: updates overwrite this file.
#
# Everything k4 needs from Hyprland: shortcuts and startup.
#
# To remove the integration, delete this file and its `source = ...k4.conf`
# line in hyprland.conf. During updates the installer may also remove old k4
# lines from your Hyprland files, keeping a *.k4.bak backup beside each first.
#
# If a shortcut conflicts with one of yours, your later definition wins in
# this classic configuration format. Put overrides in YOUR configuration,
# after the include, and bind each key to the action you want.

$k4mod = SUPER

# IPC commands. `k4` is the general target, retained for compatibility;
# new modules publish their own targets.
$k4 = quickshell ipc -p @RAIZ@/shell.qml call k4

# ── Startup ──────────────────────────────────────────────────────────────────
# `launch` runs instead of plain `quickshell` on purpose: it is what
# sets QML_IMPORT_PATH so plugins can write `import K4`. Launching
# quickshell directly the bar does not come up.
exec-once = @RAIZ@/launch --no-duplicate -d

$k4apps = quickshell ipc -p @RAIZ@/shell.qml call k4.apps

# ── Island ───────────────────────────────────────────────────────────────────
bind = $k4mod, Space, exec, $k4 toggleLauncher
# The bar's own application drawer, separate from the desktop application
# launcher above.
bind = $k4mod SHIFT, Space, exec, $k4apps toggle
bind = $k4mod, I, exec, $k4 togglePanel
bind = $k4mod, X, exec, $k4 togglePanel
bind = $k4mod, N, exec, $k4 toggleNotifications
bind = $k4mod, A, exec, $k4 toggleNotifications
bind = $k4mod, Z, exec, $k4 settings
# The wallpaper picker, straight to its page — where the palette lives too.
bind = $k4mod, W, exec, $k4 settingsSection wallpaper
bind = $k4mod SHIFT, W, exec, $k4 settingsSection wallpaper
bind = $k4mod, V, exec, $k4 clipboard
bind = $k4mod, K, exec, $k4 keys
bind = $k4mod ALT, C, exec, $k4 session
# ── Assistant ────────────────────────────────────────────────────────────────
# Selected text is not attached automatically: the header offers it, and Tab,
# a click on the chip, or the last shortcut below attaches it.
bind = $k4mod, G, exec, $k4 ask
bind = $k4mod SHIFT, G, exec, $k4 askScreen
bind = $k4mod ALT, G, exec, $k4 askRegion
bind = $k4mod CONTROL, G, exec, $k4 askSelection

# ── Multimedia ───────────────────────────────────────────────────────────────
# `bindl` keeps these shortcuts working while the screen is locked.
bindl = , XF86AudioPlay, exec, $k4 togglePlay
bindl = , XF86AudioPause, exec, $k4 togglePlay
bindl = , XF86AudioNext, exec, $k4 nextTrack
bindl = , XF86AudioPrev, exec, $k4 prevTrack
