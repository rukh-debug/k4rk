# Generado por el instalador de k4. NO LO EDITES: se reescribe al actualizar.
# Fork de rukh-debug: distribución de teclas propia (hábitos de noctalia).
#
# Todo lo que k4 necesita de Hyprland: los atajos y el arranque.
#
# Para revertirlo: borra este fichero y la línea `source = ...k4.conf` de
# hyprland.conf. No hay nada más que deshacer; el instalador no toca ningún
# otro fichero tuyo.
#
# Si alguno de estos atajos choca con uno tuyo, gana el tuyo si lo defines
# después — en el formato clásico un bind posterior reemplaza al anterior.
# (El gemelo Lua NO funciona así: acumula. Por eso k4.lua no ata ninguna
# tecla que la configuración de rukh ya use.)

$k4mod = SUPER

# Las tres llamadas de IPC. `k4` es el objetivo general, que se mantiene por
# compatibilidad; los módulos nuevos publican el suyo propio.
$k4 = quickshell ipc -p @RAIZ@/shell.qml call k4
$k4captura = quickshell ipc -p @RAIZ@/shell.qml call k4.captura
$k4editor = quickshell ipc -p @RAIZ@/shell.qml call k4.editor

# ── Arranque ─────────────────────────────────────────────────────────────────
# Se lanza `arrancar` y no `quickshell` a secas a propósito: es quien pone
# QML_IMPORT_PATH para que los plugins puedan escribir `import K4`. Lanzando
# quickshell directamente la barra no levanta.
exec-once = @RAIZ@/arrancar --no-duplicate -d

$k4apps = quickshell ipc -p @RAIZ@/shell.qml call k4.apps

# ── La island ────────────────────────────────────────────────────────────────
# Lanzador en SUPER+D y panel en SUPER+Space: donde noctalia los tenía.
bind = $k4mod, D, exec, $k4 toggleLauncher
bind = $k4mod, Space, exec, $k4 togglePanel
# El cajón de aplicaciones de la barra, que es otra cosa que el lanzador del
# escritorio de arriba. SHIFT+Space es toggle_float en la configuración de
# rukh, así que va con ALT.
bind = $k4mod ALT, Space, exec, $k4apps toggle
bind = $k4mod, I, exec, $k4 togglePanel
# X era el no-molestar de noctalia; k4 no tiene DND por IPC todavía.
bind = $k4mod, X, exec, $k4 toggleNotifications
# El acento grave, a la izquierda del 1, muy a mano. N se reserva para la
# configuración de rukh.
bind = $k4mod, `, exec, $k4 toggleNotifications
bind = $k4mod, A, exec, $k4 toggleNotifications
# Limpiar notificaciones, en las teclas de siempre.
bind = $k4mod, BackSpace, exec, $k4 clearNotifications
bind = $k4mod SHIFT, BackSpace, exec, $k4 clearNotifications
# Ajustes en SHIFT+S, donde noctalia los tenía (Z es el zoom de cursor de rukh).
bind = $k4mod SHIFT, S, exec, $k4 settings
# La atalaya no se ata: SUPER+Tab cicla ventanas en la configuración de rukh.
# bind = $k4mod, Tab, global, k4:atalaya
# Tema en SUPER+W (el fondo, donde noctalia lo tenía) y grabar en SHIFT+W.
bind = $k4mod, W, exec, $k4 theme
bind = $k4mod SHIFT, W, exec, $k4captura grabarAlternar
# Portapapeles en ambas: la tecla de k4 y la de siempre.
bind = $k4mod, V, exec, $k4 clipboard
bind = $k4mod SHIFT, V, exec, $k4 clipboard
# B es el gestor de contraseñas (rbw) en la configuración de rukh: sin ata.
# bind = $k4mod, B, exec, $k4 files
# La chuleta, solo en F1: la de «ayuda» de toda la vida. K la quiere la
# configuración de rukh para moverse entre ventanas.
bind = $k4mod, F1, exec, $k4 keys
bind = $k4mod, L, exec, $k4 lock
# Sesión por ambos caminos: el ALT+C de k4 y el CTRL+ALT+E de siempre.
bind = $k4mod ALT, C, exec, $k4 session
bind = CTRL ALT, E, exec, $k4 session
# Modo dual: la barra se parte en dos, baja por los bordes y se hace dock.
bind = $k4mod SHIFT, D, global, k4:dual

# ── El asistente ─────────────────────────────────────────────────────────────
# El texto seleccionado no se adjunta solo: se ofrece en la cabecera y se
# adjunta con Tab, con un clic en el chip, o abriendo con la última de estas.
# (SUPER+G fue wl-kbptr en su día; retirado, y la tecla vuelve a ask.)
bind = $k4mod, G, exec, $k4 ask
bind = $k4mod SHIFT, G, exec, $k4 askScreen
bind = $k4mod ALT, G, exec, $k4 askRegion
bind = $k4mod CONTROL, G, exec, $k4 askSelection

# ── Multimedia ───────────────────────────────────────────────────────────────
# Las XF86 de multimedia ya las ata la configuración de rukh: no se duplican.
# bindl = , XF86AudioPlay, exec, $k4 togglePlay
# bindl = , XF86AudioPause, exec, $k4 togglePlay
# bindl = , XF86AudioNext, exec, $k4 nextTrack
# bindl = , XF86AudioPrev, exec, $k4 prevTrack

# ── Capturas y grabación ─────────────────────────────────────────────────────
# SUPER+C es hyprpicker en la configuración de rukh, y SUPER+CTRL+C manda la
# ventana al espacio vacío: captura va por el Print y por SHIFT+C.
bind = $k4mod, Print, exec, $k4captura menu
bind = , Print, exec, $k4captura region
bind = SHIFT, Print, exec, $k4captura pantalla
bind = CONTROL, Print, exec, $k4captura ventana
# Nada de ALT + Print: con Alt pulsado el kernel convierte esa tecla en SysRq y
# Hyprland ya no ve un "Print", así que la combinación no llega nunca. Probado.

# La misma tecla arranca y para la grabación: no hay que acordarse de otra.
# (SHIFT+W, la de siempre, también la alterna — está más arriba.)
bind = $k4mod SHIFT, C, exec, $k4captura grabarAlternar

# ── El editor de vídeo ───────────────────────────────────────────────────────
# SUPER+SHIFT+E es wshowkeys en la configuración de rukh: el editor queda en
# ALT+E (retomar, con lo que hubiera a medias) y en el menú de captura.
bind = $k4mod ALT, E, exec, $k4editor retomar

# ── Los clics ────────────────────────────────────────────────────────────────
# Para que el zoom automático del editor sepa dónde estabas mirando.
# `bindn` es lo que hace que el clic siga llegando a la aplicación: sin eso el
# ratón dejaría de funcionar en cuanto se cargara esta configuración.
bindn = , mouse:272, global, k4:clic
bindn = , mouse:273, global, k4:clicDerecho
