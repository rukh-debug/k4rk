# Generado por el instalador de k4. NO LO EDITES: se reescribe al actualizar.
#
# Todo lo que k4 necesita de Hyprland: los atajos y el arranque.
#
# Para revertirlo: borra este fichero y la línea `source = ...k4.conf` de
# hyprland.conf. No hay nada más que deshacer; el instalador no toca ningún
# otro fichero tuyo.
#
# Si alguno de estos atajos choca con uno tuyo, gana el tuyo si lo defines
# después. La forma limpia de quitar uno es comentarlo en TU configuración y
# volver a atar la tecla a lo que quieras.

$k4mod = SUPER

# Las tres llamadas de IPC. `k4` es el objetivo general, que se mantiene por
# compatibilidad; los módulos nuevos publican el suyo propio.
$k4 = quickshell ipc -p @RAIZ@/shell.qml call k4

# ── Arranque ─────────────────────────────────────────────────────────────────
# Se lanza `arrancar` y no `quickshell` a secas a propósito: es quien pone
# QML_IMPORT_PATH para que los plugins puedan escribir `import K4`. Lanzando
# quickshell directamente la barra no levanta.
exec-once = @RAIZ@/arrancar --no-duplicate -d

$k4apps = quickshell ipc -p @RAIZ@/shell.qml call k4.apps

# ── La island ────────────────────────────────────────────────────────────────
bind = $k4mod, Space, exec, $k4 toggleLauncher
# El cajón de aplicaciones de la barra, que es otra cosa que el lanzador del
# escritorio de arriba.
bind = $k4mod SHIFT, Space, exec, $k4apps toggle
bind = $k4mod, I, exec, $k4 togglePanel
bind = $k4mod, X, exec, $k4 togglePanel
bind = $k4mod, N, exec, $k4 toggleNotifications
bind = $k4mod, A, exec, $k4 toggleNotifications
bind = $k4mod, Z, exec, $k4 settings
# The wallpaper picker, straight to its page — and `theme` lands there too,
# since that is where the theme's colours live now.
bind = $k4mod, W, exec, $k4 settingsSection wallpaper
bind = $k4mod SHIFT, W, exec, $k4 theme
bind = $k4mod, V, exec, $k4 clipboard
bind = $k4mod, K, exec, $k4 keys
bind = $k4mod ALT, C, exec, $k4 session
# ── El asistente ─────────────────────────────────────────────────────────────
# El texto seleccionado no se adjunta solo: se ofrece en la cabecera y se
# adjunta con Tab, con un clic en el chip, o abriendo con la última de estas.
bind = $k4mod, G, exec, $k4 ask
bind = $k4mod SHIFT, G, exec, $k4 askScreen
bind = $k4mod ALT, G, exec, $k4 askRegion
bind = $k4mod CONTROL, G, exec, $k4 askSelection

# ── Multimedia ───────────────────────────────────────────────────────────────
# `bindl` es lo que hace que funcionen con la pantalla bloqueada.
bindl = , XF86AudioPlay, exec, $k4 togglePlay
bindl = , XF86AudioPause, exec, $k4 togglePlay
bindl = , XF86AudioNext, exec, $k4 nextTrack
bindl = , XF86AudioPrev, exec, $k4 prevTrack
